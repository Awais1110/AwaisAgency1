<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin - Orders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><b class="logo">Admin Panel</b><span id="bal" class="info"></span></header>
<main>
 <div class="card" id="lg"><label>Admin Password</label><input id="pw" type="password">
 <button onclick="login()">Login</button></div>
 <div id="box" style="display:none">
  <div class="card"><select id="flt" onchange="draw()" style="width:auto"><option value="">All</option><option>Pending</option><option>Processing</option><option>Completed</option><option>Rejected</option></select>
  <button class="sm" onclick="load()">Refresh List</button> <button class="sm" onclick="balance()">Provider Balance</button></div>
  <div class="card wrap"><table id="t"></table></div>
 </div>
</main>
<div id="toast"></div>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw=sessionStorage.getItem('pw')||'',ORD=[];
function toast(m,ok){const t=$('#toast');t.textContent=m;t.style.background=ok?'var(--ok)':'var(--bad)';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function api(b){
 const r=await fetch(CONFIG.WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin:pw,...b})});
 return r.json()}
async function login(){pw=$('#pw').value;await load()}
async function load(){
 let d;try{d=await api({action:'list'})}catch(e){return toast('Worker se connect nahi hua (WORKER_URL check karo)')}
 if(d.error){sessionStorage.removeItem('pw');return toast(d.error)}
 sessionStorage.setItem('pw',pw);$('#lg').style.display='none';$('#box').style.display='block';ORD=d.orders;draw()}
function draw(){
 const f=$('#flt').value;
 $('#t').innerHTML='<tr><th>Order</th><th>Customer</th><th>Service</th><th>Link / Qty</th><th>Payment</th><th>Status</th><th></th></tr>'+
 ORD.filter(o=>!f||o.status==f).map(o=>`<tr>
 <td>${o.id}<br><span class="info">${new Date(o.date).toLocaleString()}</span></td>
 <td>${esc(o.name)}<br><a href="https://wa.me/${o.phone.replace(/\D/g,'').replace(/^0/,'92')}" target="_blank" rel="noopener">${esc(o.phone)}</a></td>
 <td>${o.sid}<br><span class="info">${esc(o.service)}</span></td>
 <td><a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.link).slice(0,40)}</a><br>Qty: ${(+o.qty).toLocaleString()}</td>
 <td>Rs ${(+o.charge).toFixed(2)}<br>${esc(o.method)}<br>TID: <b>${esc(o.tid)}</b></td>
 <td class="${o.status=='Pending'?'Pending':''}">${esc(o.status)}${o.provider?'<br><span class="info">Provider #'+esc(o.provider)+'</span>':''}</td>
 <td>${o.status=='Pending'?`<button class="sm" onclick="act('confirm','${o.id}')">Confirm</button> <button class="sm" style="background:var(--bad)" onclick="act('reject','${o.id}')">Reject</button>`
 :o.provider?`<button class="sm" onclick="act('refresh','${o.id}')">Check Status</button>`:''}</td></tr>`).join('')}
async function act(a,id){
 if(a=='confirm'&&!confirm('Payment verify ho gayi? Order provider ko bheja jayega.'))return;
 if(a=='reject'&&!confirm('Order reject karna hai?'))return;
 const d=await api({action:a,id});
 if(d.error)return toast(d.error);
 toast(a=='confirm'?'Provider ko bhej diya. Order #'+d.provider:'Done',1);load()}
async function balance(){const d=await api({action:'balance'});toast(d.error||('Balance: '+d.balance+' '+(d.currency||'')),!d.error)}
if(pw){$('#pw').value=pw;load()}
setInterval(()=>{if($('#box').style.display=='block')load()},60000);
</script>
</body>
</html>
